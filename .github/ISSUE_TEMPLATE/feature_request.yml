name: Feature request
description: Suggest an improvement to painting, planning, review or tooling
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to paint or do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
