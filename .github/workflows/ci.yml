name: CI

# Light on purpose: the agent's own suites (plugin Python, companion JS and typecheck). Building Krita takes hours, so the C++
# tests run locally (agent/ci.sh, which agent/publish.sh requires green before it pushes). Free hosted runners are enough:
# this repository is public.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-suites:
    name: Agent suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS is the supported platform; Linux is informational until the cross-platform runtime lands.
    continue-on-error: ${{ matrix.os != 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: creative-agent/krita-creative-agent/package-lock.json
      - name: Install uv (runs the Python tests)
        # A virtual environment: the hosted runners' system Python refuses `pip install --user` (externally managed).
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/pip" install uv
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
      - name: Install the companion's packages
        working-directory: creative-agent/krita-creative-agent
        run: npm ci --ignore-scripts
      - name: Plugin Python suite, companion JS suite and typecheck
        run: agent/ci.sh --no-cpp
