name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos-bundle:
    runs-on: macos-14   # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        working-directory: companion
        run: npm ci --ignore-scripts
      - name: Build the release (pins Node and its official checksums; validates with that runtime)
        run: python3 companion/scripts/build-release.py --output dist/krita-creative-agent
      - name: Package
        run: |
          cd dist && zip -qry "krita-creative-agent-${GITHUB_REF_NAME}-macos.zip" krita-creative-agent
          shasum -a 256 "krita-creative-agent-${GITHUB_REF_NAME}-macos.zip" > "krita-creative-agent-${GITHUB_REF_NAME}-macos.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
