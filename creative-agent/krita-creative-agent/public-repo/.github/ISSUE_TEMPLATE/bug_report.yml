name: Bug report
description: Something in the panel, the agent or the bridge did not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a disposable document. Never attach private artwork.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Creative Agent build id (panel → Diagnostics), Krita version, macOS version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Panel → Export troubleshooting report. It contains no API keys; check it for anything private before pasting.
      render: json
